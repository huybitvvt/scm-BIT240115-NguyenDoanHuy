<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa hàng sản phẩm - Menu</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 960px; margin: 32px auto; padding: 0 20px; line-height: 1.6; color: #18243b; }
    header, nav, main, footer { margin-bottom: 24px; }
    nav { padding: 16px; background: #edf3ff; border-radius: 8px; }
    nav a { margin-right: 20px; color: #173fa0; }
    li { margin-bottom: 12px; }
    footer { border-top: 1px solid #c9d2e1; padding-top: 12px; }
  </style>
</head>
<body>
  <header id="home">
    <h1>Cửa hàng sản phẩm</h1>
    <p>Bài thực hành SCM - nhóm mô phỏng 3 thành viên.</p>
  </header>

  <nav id="menu" aria-label="Điều hướng chính">
    <a href="#home">Trang chủ</a>
    <a href="#content">Sản phẩm</a>
    <a href="#contact">Liên hệ</a>
  </nav>

  <main>
    <section id="content" aria-labelledby="product-heading">
      <h2 id="product-heading">Danh sách sản phẩm</h2>
      <p>Nội dung sản phẩm đang được cập nhật.</p>
    </section>
  </main>

  <footer id="contact">
    <h2>Liên hệ</h2>
    <p>Thông tin liên hệ đang được cập nhật.</p>
  </footer>
</body>
</html>
